<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>River Raid 16-Bit Mobile Joystick</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0d0e15;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none; /* Bloqueia rolar e dar zoom no mobile */
        }
        h1 {
            margin-bottom: 6px;
            color: #ffcc00;
            text-shadow: 2px 2px #ff0055;
            font-size: 18px;
            letter-spacing: 1px;
            text-align: center;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            border: 3px solid #334466;
            border-radius: 8px;
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
            background-color: #000;
            image-rendering: pixelated;
            width: 100%;
            height: auto;
            max-height: 75vh;
        }

        /* --- CONTROLES VIRTUAIS NOS CANTOS INFERIORES --- */
        .controls-overlay {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            height: 120px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 15px;
            pointer-events: none; /* Permite interagir apenas com os botões */
            z-index: 10;
        }

        /* Joystick (Esquerda) */
        #joystick-base {
            width: 100px;
            height: 100px;
            background: rgba(20, 30, 45, 0.65);
            border: 2px solid rgba(0, 255, 204, 0.6);
            border-radius: 50%;
            position: relative;
            pointer-events: auto;
            touch-action: none;
            backdrop-filter: blur(3px);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }
        #joystick-knob {
            width: 44px;
            height: 44px;
            background: radial-gradient(circle, #00ffcc, #008888);
            border: 2px solid #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.8);
            pointer-events: none;
            transition: transform 0.05s ease-out;
        }

        /* Botão de Tiro (Direita) */
        #shoot-btn {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #ff0055, #990033);
            border: 3px solid #ff6699;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px #000;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
            pointer-events: auto;
            touch-action: none;
            cursor: pointer;
        }
        #shoot-btn:active, #shoot-btn.active {
            background: radial-gradient(circle, #ff3300, #cc0000);
            border-color: #ffffff;
            transform: scale(0.93);
            box-shadow: 0 0 20px rgba(255, 51, 0, 0.9);
        }

        .instructions {
            margin-top: 8px;
            font-size: 11px;
            color: #aaa;
            text-align: center;
            max-width: 380px;
            line-height: 1.3;
        }
        .instructions span {
            color: #00ffcc;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>RIVER RAID 16-BIT</h1>

    <div id="game-container">
        <canvas id="gameCanvas" width="360" height="540"></canvas>

        <!-- Overlays de Controles Touch nos Cantos -->
        <div class="controls-overlay">
            <!-- Joystick Esquerdo -->
            <div id="joystick-base">
                <div id="joystick-knob"></div>
            </div>

            <!-- Botão de Tiro Direito -->
            <div id="shoot-btn">TIRO</div>
        </div>
    </div>

    <div class="instructions">
        <span>Esq:</span> Joystick (Direção/Velocidade)<br>
        <span>Dir:</span> Clique = 1 tiro | Segure (0.5s) = Tiros contínuos
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// --- SINTETIZADOR DE ÁUDIO RETRO ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.12);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
    } else if (type === 'explosion') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(30, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
    } else if (type === 'fuel') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
    }
}

// --- ESTADO DO JOGO ---
let gameState = 'START';
let score = 0;
let highScore = localStorage.getItem('rr16_highscore') || 0;
let distance = 0;

// --- JOGADOR ---
const player = {
    x: canvas.width / 2 - 12,
    y: canvas.height - 90,
    width: 24,
    height: 28,
    speedX: 4,
    fuel: 100,
    maxFuel: 100,
    lastShootTime: 0
};

// --- RIO E TERRENO ---
const sliceHeight = 10;
const totalSlices = Math.ceil(canvas.height / sliceHeight) + 2;
let riverSlices = [];
let noiseSeed = Math.random() * 100;

function generateInitialRiver() {
    riverSlices = [];
    for (let i = 0; i < totalSlices; i++) {
        riverSlices.push(createRiverSlice(i * sliceHeight));
    }
}

function createRiverSlice(y) {
    const center = canvas.width / 2 + Math.sin((distance + y) * 0.008 + noiseSeed) * 70;
    const width = 160 + Math.sin((distance + y) * 0.004) * 30;
    return {
        y: y,
        left: Math.max(20, center - width / 2),
        right: Math.min(canvas.width - 20, center + width / 2)
    };
}

// --- ENTIDADES ---
let bullets = [];
let enemies = [];
let fuelTanks = [];
let explosions = [];

function spawnEntities() {
    if (Math.random() < 0.035) {
        const topSlice = riverSlices[0];
        const minX = topSlice.left + 15;
        const maxX = topSlice.right - 35;
        if (maxX > minX) {
            const x = minX + Math.random() * (maxX - minX);
            const rand = Math.random();
            if (rand < 0.4) {
                enemies.push({ x, y: -30, width: 22, height: 20, type: 'ship', speedX: 1, dir: Math.random() > 0.5 ? 1 : -1 });
            } else if (rand < 0.7) {
                enemies.push({ x, y: -30, width: 20, height: 20, type: 'heli', speedX: 1.8, dir: Math.random() > 0.5 ? 1 : -1 });
            } else {
                fuelTanks.push({ x, y: -30, width: 20, height: 26 });
            }
        }
    }
}

// --- LÓGICA DE CONTROLE DO JOYSTICK ---
const joystickBase = document.getElementById('joystick-base');
const joystickKnob = document.getElementById('joystick-knob');
let joystickActive = false;
let joystickVector = { x: 0, y: 0 }; // Valores de -1.0 a +1.0

function handleJoystickStart(e) {
    if (e.cancelable) e.preventDefault();
    initAudio();
    if (gameState === 'START' || gameState === 'GAMEOVER') {
        resetGame();
        gameState = 'PLAYING';
    }
    joystickActive = true;
    updateJoystickPos(e);
}

function handleJoystickMove(e) {
    if (e.cancelable) e.preventDefault();
    if (!joystickActive) return;
    updateJoystickPos(e);
}

function handleJoystickEnd(e) {
    if (e.cancelable) e.preventDefault();
    joystickActive = false;
    joystickVector = { x: 0, y: 0 };
    joystickKnob.style.transform = `translate(-50%, -50%)`;
}

function updateJoystickPos(e) {
    const rect = joystickBase.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] : e;
    
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    
    let dx = touch.clientX - centerX;
    let dy = touch.clientY - centerY;
    
    const maxRadius = rect.width / 2;
    const distance = Math.sqrt(dx * dx + dy * dy);
    
    if (distance > maxRadius) {
        dx = (dx / distance) * maxRadius;
        dy = (dy / distance) * maxRadius;
    }
    
    joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    
    joystickVector.x = dx / maxRadius;
    joystickVector.y = dy / maxRadius;
}

joystickBase.addEventListener('touchstart', handleJoystickStart, { passive: false });
joystickBase.addEventListener('touchmove', handleJoystickMove, { passive: false });
joystickBase.addEventListener('touchend', handleJoystickEnd, { passive: false });
joystickBase.addEventListener('touchcancel', handleJoystickEnd, { passive: false });

// Support Mouse no Joystick para testes no PC
joystickBase.addEventListener('mousedown', handleJoystickStart);
window.addEventListener('mousemove', (e) => { if (joystickActive) handleJoystickMove(e); });
window.addEventListener('mouseup', handleJoystickEnd);


// --- LÓGICA DO BOTÃO DE TIRO (CLIQUE ÚNICO x SEGURAR 0.5s) ---
const shootBtn = document.getElementById('shoot-btn');
let isShootPressed = false;
let shootPressStartTime = 0;

function fireBullet() {
    bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, width: 4, height: 10 });
    playSound('shoot');
    player.lastShootTime = Date.now();
}

function handleShootStart(e) {
    if (e.cancelable) e.preventDefault();
    initAudio();

    if (gameState === 'START' || gameState === 'GAMEOVER') {
        resetGame();
        gameState = 'PLAYING';
        return;
    }

    isShootPressed = true;
    shootPressStartTime = Date.now();
    shootBtn.classList.add('active');

    // TIRO IMEDIATO NO CLIQUE
    if (gameState === 'PLAYING') {
        fireBullet();
    }
}

function handleShootEnd(e) {
    if (e.cancelable) e.preventDefault();
    isShootPressed = false;
    shootBtn.classList.remove('active');
}

shootBtn.addEventListener('touchstart', handleShootStart, { passive: false });
shootBtn.addEventListener('touchend', handleShootEnd, { passive: false });
shootBtn.addEventListener('touchcancel', handleShootEnd, { passive: false });
shootBtn.addEventListener('mousedown', handleShootStart);
window.addEventListener('mouseup', handleShootEnd);

// Support Teclado
const keys = {};
window.addEventListener('keydown', e => {
    initAudio();
    keys[e.code] = true;
    if ((gameState === 'START' || gameState === 'GAMEOVER') && e.code === 'Space') {
        resetGame();
        gameState = 'PLAYING';
    }
    if (gameState === 'PLAYING' && e.code === 'Space' && !e.repeat) {
        fireBullet();
    }
});
window.addEventListener('keyup', e => keys[e.code] = false);

// --- ATUALIZAÇÃO DO JOGO ---
function update() {
    if (gameState !== 'PLAYING') return;

    // 1. Velocidade de rolamento (Joystick Y ou Teclado)
    let scrollSpeed = 2.5; // Normal
    if (joystickVector.y < -0.3 || keys['KeyW'] || keys['ArrowUp']) {
        scrollSpeed = 4.5; // Acelerar (Para cima)
    } else if (joystickVector.y > 0.3 || keys['KeyS'] || keys['ArrowDown']) {
        scrollSpeed = 1.2; // Frear (Para baixo)
    }

    distance += scrollSpeed;

    // 2. Consumo de Combustível
    player.fuel -= 0.06 * (scrollSpeed / 2.5);
    if (player.fuel <= 0) {
        playerExplode();
        return;
    }

    // 3. Movimento Lateral (Joystick X ou Teclado)
    if (Math.abs(joystickVector.x) > 0.1) {
        player.x += joystickVector.x * player.speedX;
    } else {
        if (keys['KeyA'] || keys['ArrowLeft']) player.x -= player.speedX;
        if (keys['KeyD'] || keys['ArrowRight']) player.x += player.speedX;
    }

    // Limites de tela do jogador
    player.x = Math.max(10, Math.min(canvas.width - player.width - 10, player.x));

    // 4. Lógica de Tiro Contínuo ao Segurar por >= 0.5s (500ms)
    const now = Date.now();
    const isHoldingShoot = isShootPressed || keys['Space'];
    if (isHoldingShoot) {
        const holdDuration = now - shootPressStartTime;
        if (holdDuration >= 500) { // Passou de 0.5s
            if (now - player.lastShootTime > 160) { // Rajada contínua
                fireBullet();
            }
        }
    }

    // 5. Atualizar Rio
    for (let slice of riverSlices) {
        slice.y += scrollSpeed;
    }
    if (riverSlices[riverSlices.length - 1].y >= canvas.height) {
        riverSlices.pop();
        const newY = riverSlices[0].y - sliceHeight;
        riverSlices.unshift(createRiverSlice(newY));
    }

    // 6. Colisão com Margens
    const playerSlice = riverSlices.find(s => player.y >= s.y && player.y < s.y + sliceHeight);
    if (playerSlice) {
        if (player.x < playerSlice.left || player.x + player.width > playerSlice.right) {
            playerExplode();
            return;
        }
    }

    // 7. Atualizar Balas
    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= 7;
        if (bullets[i].y < -10) bullets.splice(i, 1);
    }

    spawnEntities();

    // 8. Inimigos
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.y += scrollSpeed;
        e.x += e.speedX * e.dir;

        const eSlice = riverSlices.find(s => e.y >= s.y && e.y < s.y + sliceHeight);
        if (eSlice) {
            if (e.x <= eSlice.left || e.x + e.width >= eSlice.right) {
                e.dir *= -1;
            }
        }

        // Bala x Inimigo
        for (let j = bullets.length - 1; j >= 0; j--) {
            let b = bullets[j];
            if (checkCollision(b, e)) {
                createExplosion(e.x + e.width/2, e.y + e.height/2);
                playSound('explosion');
                score += e.type === 'heli' ? 60 : 30;
                enemies.splice(i, 1);
                bullets.splice(j, 1);
                break;
            }
        }

        if (enemies[i] && checkCollision(player, e)) {
            playerExplode();
            return;
        }

        if (e && e.y > canvas.height + 40) enemies.splice(i, 1);
    }

    // 9. Tanques de Combustível (FUEL)
    for (let i = fuelTanks.length - 1; i >= 0; i--) {
        let f = fuelTanks[i];
        f.y += scrollSpeed;

        // Passar por cima: Reabastece gradualmente
        if (checkCollision(player, f)) {
            player.fuel = Math.min(player.maxFuel, player.fuel + 0.8);
            playSound('fuel');
        }

        // DESTRUIR O TANQUE DE GASOLINA COM O TIRO (+30 DE COMBUSTÍVEL)
        for (let j = bullets.length - 1; j >= 0; j--) {
            let b = bullets[j];
            if (checkCollision(b, f)) {
                createExplosion(f.x + f.width/2, f.y + f.height/2);
                playSound('explosion');
                playSound('fuel');
                score += 80;
                player.fuel = Math.min(player.maxFuel, player.fuel + 30);
                fuelTanks.splice(i, 1);
                bullets.splice(j, 1);
                break;
            }
        }

        if (fuelTanks[i] && f.y > canvas.height + 40) fuelTanks.splice(i, 1);
    }

    // Explosões
    for (let i = explosions.length - 1; i >= 0; i--) {
        let p = explosions[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if (p.life <= 0) explosions.splice(i, 1);
    }
}

function checkCollision(a, b) {
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
}

function createExplosion(x, y) {
    for (let i = 0; i < 15; i++) {
        explosions.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            color: ['#ff0055', '#ffcc00', '#ffffff', '#ff6600'][Math.floor(Math.random() * 4)],
            size: Math.random() * 4 + 2,
            life: 1.0
        });
    }
}

function playerExplode() {
    createExplosion(player.x + player.width / 2, player.y + player.height / 2);
    playSound('explosion');
    gameState = 'GAMEOVER';
    isShootPressed = false;
    joystickActive = false;
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('rr16_highscore', highScore);
    }
}

function resetGame() {
    score = 0;
    distance = 0;
    player.fuel = 100;
    player.x = canvas.width / 2 - 12;
    bullets = [];
    enemies = [];
    fuelTanks = [];
    explosions = [];
    noiseSeed = Math.random() * 100;
    generateInitialRiver();
}

// --- RENDERIZAÇÃO ---
function draw() {
    ctx.fillStyle = '#1e5d22';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Rio
    ctx.fillStyle = '#0066cc';
    for (let i = 0; i < riverSlices.length; i++) {
        let s = riverSlices[i];
        ctx.fillRect(s.left, s.y, s.right - s.left, sliceHeight + 1);
        ctx.fillStyle = '#339933';
        ctx.fillRect(s.left - 4, s.y, 4, sliceHeight + 1);
        ctx.fillRect(s.right, s.y, 4, sliceHeight + 1);
        ctx.fillStyle = '#0066cc';
    }

    // Ondas
    ctx.fillStyle = '#3399ff';
    for (let i = 0; i < canvas.height; i += 40) {
        let y = (i + distance) % canvas.height;
        ctx.fillRect(canvas.width / 2 - 20, y, 12, 2);
        ctx.fillRect(canvas.width / 2 + 30, (y + 20) % canvas.height, 8, 2);
    }

    // Tanques FUEL
    for (let f of fuelTanks) {
        ctx.fillStyle = '#ff2200';
        ctx.fillRect(f.x, f.y, f.width, f.height);
        ctx.fillStyle = '#ffcc00';
        ctx.fillRect(f.x + 2, f.y + 2, f.width - 4, f.height - 4);
        ctx.fillStyle = '#000';
        ctx.font = 'bold 9px monospace';
        ctx.fillText('FUEL', f.x + 1, f.y + 16);
    }

    // Inimigos
    for (let e of enemies) {
        if (e.type === 'ship') {
            ctx.fillStyle = '#8899a6';
            ctx.fillRect(e.x, e.y + 4, e.width, e.height - 8);
            ctx.fillStyle = '#cc0000';
            ctx.fillRect(e.x + 4, e.y, e.width - 8, e.height);
        } else {
            ctx.fillStyle = '#ffaa00';
            ctx.fillRect(e.x + 4, e.y + 4, e.width - 8, e.height - 6);
            ctx.fillStyle = '#111';
            if (Math.floor(Date.now() / 50) % 2 === 0) {
                ctx.fillRect(e.x - 2, e.y + 2, e.width + 4, 2);
            } else {
                ctx.fillRect(e.x + e.width/2 - 1, e.y - 3, 2, e.height + 4);
            }
        }
    }

    // Balas
    ctx.fillStyle = '#ffff00';
    for (let b of bullets) {
        ctx.fillRect(b.x, b.y, b.width, b.height);
    }

    // Explosões
    for (let p of explosions) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    }

    // Caça
    if (gameState === 'PLAYING') {
        let x = player.x;
        let y = player.y;

        ctx.fillStyle = '#dddddd';
        ctx.fillRect(x, y + 12, 24, 8);
        ctx.fillStyle = '#ff0044';
        ctx.fillRect(x + 9, y, 6, 26);
        ctx.fillStyle = '#ffff00';
        ctx.fillRect(x + 10, y - 3, 4, 3);
        ctx.fillStyle = '#00ffff';
        ctx.fillRect(x + 10, y + 6, 4, 6);
        ctx.fillStyle = Math.random() > 0.5 ? '#ff9900' : '#ff0000';
        ctx.fillRect(x + 10, y + 26, 4, 5);
    }

    // HUD
    ctx.fillStyle = '#111122';
    ctx.fillRect(0, canvas.height - 35, canvas.width, 35);
    ctx.strokeStyle = '#334466';
    ctx.lineWidth = 2;
    ctx.strokeRect(0, canvas.height - 35, canvas.width, 35);

    // Barra Fuel
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px monospace';
    ctx.fillText('FUEL', 12, canvas.height - 14);

    ctx.fillStyle = '#333';
    ctx.fillRect(45, canvas.height - 22, 100, 10);

    let fuelColor = '#00ffcc';
    if (player.fuel < 30) fuelColor = '#ff0055';
    else if (player.fuel < 60) fuelColor = '#ffcc00';

    ctx.fillStyle = fuelColor;
    ctx.fillRect(45, canvas.height - 22, Math.max(0, player.fuel), 10);

    // Score
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px monospace';
    ctx.fillText(`SCORE: ${score}`, 160, canvas.height - 12);
    ctx.fillText(`HI: ${highScore}`, 275, canvas.height - 12);

    // Overlays
    if (gameState === 'START') {
        drawOverlay('RIVER RAID 16-BIT', 'Toque no Joystick/Tiro para Iniciar');
    } else if (gameState === 'GAMEOVER') {
        drawOverlay('FIM DE JOGO', 'Toque para Reiniciar');
    }
}

function drawOverlay(title, subtitle) {
    ctx.fillStyle = 'rgba(10, 15, 30, 0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ffcc00';
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 20);

    ctx.fillStyle = '#ffffff';
    ctx.font = '11px monospace';
    ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 20);
    ctx.textAlign = 'left';
}

// Loop
generateInitialRiver();
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

</script>
</body>
</html>
