<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>River Raid 16-Bit Edition</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d11;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-wrapper {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border-radius: 12px;
      overflow: hidden;
      border: 4px solid #2a2a35;
      background-color: #181820;
    }

    /* Tela de Jogo */
    #canvas-container {
      position: relative;
      width: 100%;
      height: 60vh;
      max-height: 500px;
      background-color: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Controls Mobile 16-bit */
    #mobile-controls {
      width: 100%;
      height: 38vh;
      max-height: 220px;
      background: linear-gradient(180deg, #282834 0%, #1a1a24 100%);
      border-top: 4px solid #3a3a4c;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
    }

    /* D-PAD Retro */
    .d-pad {
      position: relative;
      width: 130px;
      height: 130px;
    }

    .d-btn {
      position: absolute;
      background-color: #383848;
      border: 2px solid #121218;
      box-shadow: inset 2px 2px 0 #58586a, inset -2px -2px 0 #181820;
      touch-action: manipulation;
    }

    .d-btn:active, .d-btn.active {
      background-color: #22222c;
      box-shadow: inset -2px -2px 0 #48485a, inset 2px 2px 0 #101014;
    }

    .d-up    { top: 0; left: 43px; width: 44px; height: 48px; border-radius: 6px 6px 0 0; }
    .d-down  { bottom: 0; left: 43px; width: 44px; height: 48px; border-radius: 0 0 6px 6px; }
    .d-left  { top: 43px; left: 0; width: 48px; height: 44px; border-radius: 6px 0 0 6px; }
    .d-right { top: 43px; right: 0; width: 48px; height: 44px; border-radius: 0 6px 6px 0; }
    .d-center { top: 43px; left: 43px; width: 44px; height: 44px; background-color: #383848; border: none; }

    /* Botões A/B */
    .action-group {
      display: flex;
      gap: 16px;
      transform: rotate(-12deg);
    }

    .btn-action {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 3px solid #121218;
      color: #fff;
      font-weight: bold;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 3px 3px 0 rgba(255,255,255,0.35), inset -3px -3px 0 rgba(0,0,0,0.6), 0 4px 8px rgba(0,0,0,0.4);
      touch-action: manipulation;
    }

    .btn-a { background-color: #d32f2f; }
    .btn-b { background-color: #fbc02d; color: #1a1a1a; }

    .btn-action:active, .btn-action.active {
      transform: scale(0.94);
      box-shadow: inset -2px -2px 0 rgba(255,255,255,0.3), inset 3px 3px 0 rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <div id="canvas-container">
      <canvas id="gameCanvas" width="320" height="480"></canvas>
    </div>

    <!-- Controles Mobile -->
    <div id="mobile-controls">
      <div class="d-pad">
        <div class="d-btn d-up" id="btn-up"></div>
        <div class="d-btn d-left" id="btn-left"></div>
        <div class="d-btn d-center"></div>
        <div class="d-btn d-right" id="btn-right"></div>
        <div class="d-btn d-down" id="btn-down"></div>
      </div>

      <div class="action-group">
        <div class="btn-action btn-b" id="btn-b">B</div>
        <div class="btn-action btn-a" id="btn-a">A</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // Função de carregamento seguro das sprites criadas por você
    const imgPlayer = new Image();
    const imgHeli   = new Image();
    const imgShip   = new Image();
    const imgFuel   = new Image();

    // Carregamento dinâmico das sprites embutidas
    const spritesSheet = new Image();
    spritesSheet.src = 'image_e9ab6b.png'; // Pode usar a imagem inteira ou as variáveis separadas

    let scrollY = 0;
    const scrollSpeed = 2;

    const player = { x: 142, y: 380, w: 36, h: 34, speed: 3.5 };
    let fuelLevel = 85;

    // Lista de Objetos / Inimigos no Rio
    const entities = [
      { type: 'fuel', x: 140, y: -50, w: 32, h: 48 },
      { type: 'heli', x: 80,  y: -220, w: 32, h: 28, dir: 1 },
      { type: 'ship', x: 150, y: -400, w: 52, h: 32, dir: -1 },
      { type: 'fuel', x: 135, y: -600, w: 32, h: 48 },
      { type: 'heli', x: 170, y: -800, w: 32, h: 28, dir: -1 }
    ];

    const keys = { left: false, right: false, up: false, down: false };

    function bindTouch(id, key) {
      const el = document.getElementById(id);
      const press = (e) => { e.preventDefault(); keys[key] = true; el.classList.add('active'); };
      const release = (e) => { e.preventDefault(); keys[key] = false; el.classList.remove('active'); };
      el.addEventListener('touchstart', press);
      el.addEventListener('touchend', release);
      el.addEventListener('mousedown', press);
      el.addEventListener('mouseup', release);
      el.addEventListener('mouseleave', release);
    }

    bindTouch('btn-left', 'left');
    bindTouch('btn-right', 'right');
    bindTouch('btn-up', 'up');
    bindTouch('btn-down', 'down');

    // Suporte a teclado no PC
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
      if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
      if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
      if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
      if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
    });

    // Gera as margens e o canal de água clássicos do River Raid
    function drawRiverBank(yOffset) {
      // Fundo da Água (Azul River Raid)
      ctx.fillStyle = '#0000aa';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Terra/Grama Lateral (Verde Atari)
      ctx.fillStyle = '#00aa00';

      const step = 40;
      for (let y = -step; y < canvas.height + step; y += step) {
        const drawY = y + (yOffset % step);
        const mapIndex = Math.floor((yOffset - y) / step);

        // Curvatura do Rio
        let leftWidth = 55 + Math.sin(mapIndex * 0.4) * 25;
        let rightWidth = 55 + Math.cos(mapIndex * 0.4) * 25;

        // Margem Esquerda
        ctx.fillRect(0, drawY, leftWidth, step + 1);
        // Margem Direita
        ctx.fillRect(canvas.width - rightWidth, drawY, rightWidth, step + 1);
      }
    }

    // Painel HUD Inferior
    function drawHUD() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, canvas.height - 32, canvas.width, 32);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px monospace';
      ctx.fillText('E   F U E L   F', 80, canvas.height - 12);

      // Barra Amarela de Combustível
      ctx.fillStyle = '#ffcc00';
      const barWidth = (fuelLevel / 100) * 110;
      ctx.fillRect(105, canvas.height - 24, Math.max(0, barWidth), 8);
      ctx.strokeStyle = '#fff';
      ctx.strokeRect(105, canvas.height - 24, 110, 8);
    }

    function update() {
      let currentSpeed = scrollSpeed;
      if (keys.up) currentSpeed = scrollSpeed * 1.8;
      if (keys.down) currentSpeed = scrollSpeed * 0.5;

      scrollY += currentSpeed;

      fuelLevel -= 0.02;
      if (fuelLevel <= 0) fuelLevel = 100;

      if (keys.left && player.x > 55) player.x -= player.speed;
      if (keys.right && player.x < canvas.width - 55 - player.w) player.x += player.speed;

      entities.forEach(ent => {
        ent.y += currentSpeed;

        if (ent.type === 'heli' || ent.type === 'ship') {
          ent.x += (ent.dir || 1) * 0.7;
          if (ent.x < 65 || ent.x > canvas.width - 65 - ent.w) ent.dir *= -1;
        }

        if (ent.y > canvas.height) {
          ent.y = -200 - Math.random() * 250;
          ent.x = 75 + Math.random() * (canvas.width - 150);
        }
      });
    }

    function render() {
      // 1. Rio Estilo River Raid
      drawRiverBank(scrollY);

      // 2. Desenhar Entidades usando Sprites recortadas
      entities.forEach(ent => {
        if (spritesSheet.complete) {
          if (ent.type === 'fuel') {
            ctx.drawImage(spritesSheet, 245, 148, 87, 130, ent.x, ent.y, ent.w, ent.h);
          } else if (ent.type === 'heli') {
            ctx.drawImage(spritesSheet, 175, 404, 44, 40, ent.x, ent.y, ent.w, ent.h);
          } else if (ent.type === 'ship') {
            ctx.drawImage(spritesSheet, 84, 487, 87, 52, ent.x, ent.y, ent.w, ent.h);
          }
        }
      });

      // 3. Desenhar Jogador
      if (spritesSheet.complete) {
        ctx.drawImage(spritesSheet, 358, 422, 74, 69, player.x, player.y, player.w, player.h);
      }

      // 4. Desenhar HUD de combustível
      drawHUD();
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    spritesSheet.onload = () => {
      gameLoop();
    };
    // Fallback caso a imagem já esteja em cache
    if (spritesSheet.complete) {
      gameLoop();
    }
  </script>
</body>
</html>
