<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>River Raid Retro Console</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: #0b0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: monospace, sans-serif;
            overflow: hidden;
        }

        #console {
            width: 330px;
            background: #232634;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 2px 3px rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            border: 2px solid #313547;
        }

        .screen-bezel {
            width: 100%;
            background-color: #151722;
            border-radius: 12px;
            padding: 12px;
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a2d3d;
        }

        .screen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .power-led {
            width: 8px;
            height: 8px;
            background-color: #ff3333;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff3333;
        }

        .screen-title {
            color: #89b4fa;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #gameCanvas {
            width: 100%;
            height: 270px;
            background-color: #000000;
            border-radius: 6px;
            display: block;
            image-rendering: pixelated;
        }

        .controls {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px;
        }

        /* ----- JOYSTICK 8-BIT ESTILO ARCADE ----- */
        .joystick-base {
            width: 96px;
            height: 96px;
            background-color: #000000;
            border: 3px solid #111;
            border-radius: 4px;
            position: relative;
            touch-action: none;
            cursor: pointer;
            box-shadow: inset 0 0 0 2px #222;
        }

        /* Parafusos nos cantos */
        .screw {
            width: 4px;
            height: 4px;
            background-color: #e2e8f0;
            position: absolute;
            box-shadow: 0 0 1px #000;
        }
        .screw-tl { top: 4px; left: 4px; }
        .screw-tr { top: 4px; right: 4px; }
        .screw-bl { bottom: 20px; left: 4px; }
        .screw-br { bottom: 20px; right: 4px; }

        /* Barra inferior cinza do painel arcade */
        .joystick-panel-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 16px;
            background-color: #4b5563;
            border-top: 3px solid #1f2937;
        }

        /* Guia octogonal do centro */
        .joystick-gate {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 32px;
            height: 32px;
            transform: translate(-50%, -60%);
            background: #6b7280;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .joystick-gate-inner {
            width: 20px;
            height: 20px;
            background: #1f2937;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
        }

        /* Haste e Bola Vermelha */
        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 60px;
            margin-top: -42px;
            margin-left: -20px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.05s ease-out;
            will-change: transform;
        }

        /* Esfera vermelha pixelada */
        .knob-ball {
            width: 34px;
            height: 34px;
            background-color: #dc2626;
            border-radius: 50%;
            border: 2px solid #7f1d1d;
            box-shadow: inset -4px -4px 0 #991b1b, inset 4px 4px 0 #ef4444;
            position: relative;
            z-index: 2;
        }

        .knob-ball::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            width: 8px;
            height: 8px;
            background-color: #f87171;
            border-radius: 50%;
        }

        /* Haste prateada */
        .knob-shaft {
            width: 12px;
            height: 22px;
            background: linear-gradient(90deg, #9ca3af 0%, #e5e7eb 50%, #6b7280 100%);
            border: 2px solid #374151;
            margin-top: -4px;
            z-index: 1;
        }

        /* Botões de Ação */
        .action-buttons {
            display: flex;
            gap: 12px;
            transform: rotate(-10deg);
        }

        .btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.5);
            touch-action: manipulation;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.5);
        }

        .btn-b { background-color: #f9e2af; color: #11111b; }
        .btn-a { background-color: #f38ba8; color: #11111b; }

        .system-buttons {
            display: flex;
            gap: 16px;
        }

        .sys-btn {
            width: 40px;
            height: 10px;
            background-color: #45475a;
            border: none;
            border-radius: 5px;
            transform: rotate(-20deg);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="console">
        <div class="screen-bezel">
            <div class="screen-header">
                <div class="power-led"></div>
                <div class="screen-title">RIVER RAID 8-BIT</div>
            </div>
            <canvas id="gameCanvas" width="220" height="270"></canvas>
        </div>

        <div class="controls">
            <!-- Joystick Arcade 8-Bit -->
            <div class="joystick-base" id="joystick-base">
                <div class="screw screw-tl"></div>
                <div class="screw screw-tr"></div>
                <div class="screw screw-bl"></div>
                <div class="screw screw-br"></div>
                <div class="joystick-panel-bottom"></div>
                
                <div class="joystick-gate">
                    <div class="joystick-gate-inner"></div>
                </div>

                <div id="joystick-knob">
                    <div class="knob-ball"></div>
                    <div class="knob-shaft"></div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-b" id="btn-b">B</button>
                <button class="btn btn-a" id="btn-a">A</button>
            </div>
        </div>

        <div class="system-buttons">
            <button class="sys-btn" id="btn-select"></button>
            <button class="sys-btn" id="btn-start"></button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const C = {
            O: '#E65100', W: '#FFFFFF', Y: '#FACC15',
            G: '#4D7C0F', B: '#1E40AF', K: '#111827',
            R: '#DC2626', BR: '#78350F'
        };

        const SPRITES = {
            FUEL: {
                scale: 1.5,
                width: 18,
                matrix: [
                    "  YYYYYYYY  ",
                    "  Y FUEL Y  ",
                    "     VV     ",
                    "  OOOOOOOO  ",
                    " OOWWOOWWOO ",
                    " OOWWOOWWOO ",
                    " OOOOOOOOOO ",
                    " OOWWOOWWOO ",
                    " OOWWOOWWOO ",
                    "  OOOOOOOO  "
                ]
            },
            HELI: {
                scale: 1.5,
                width: 18,
                matrix: [
                    "   YYYYYY   ",
                    "     YY     ",
                    "   GGGGGG   ",
                    "  GGBBBGGG  ",
                    "GGGGGGGGGGG ",
                    "   G  K     ",
                    "  KKKKKKK   "
                ]
            },
            SHIP: {
                scale: 1.5,
                width: 20,
                matrix: [
                    "  W         ",
                    " WW  Y R B  ",
                    " WWW W W W  ",
                    "KKKKKKKKKKKK",
                    "RRRRRRRRRRRR",
                    " RRRRRRRRRR "
                ]
            },
            PLAYER: {
                scale: 1.5,
                width: 18,
                matrix: [
                    "    WWWW    ",
                    "     BR     ",
                    "RRRRRRRRRRRR",
                    "R R R  R R R",
                    "    BRBR    ",
                    " RRRRRRRRRR ",
                    "     RR     "
                ]
            }
        };

        function drawSprite(spriteKey, x, y) {
            const spr = SPRITES[spriteKey];
            const scale = spr.scale;
            const matrix = spr.matrix;

            for (let r = 0; r < matrix.length; r++) {
                for (let c = 0; c < matrix[r].length; c++) {
                    const char = matrix[r][c];
                    if (char !== ' ') {
                        ctx.fillStyle = (char === 'F' || char === 'U' || char === 'E' || char === 'L' || char === 'V') 
                            ? C.Y : (C[char] || '#FFF');
                        ctx.fillRect(x + c * scale, y + r * scale, scale, scale);
                    }
                }
            }
        }

        let player = { x: 100, y: 210, w: 18, h: 12, speed: 2.2 };
        let fuel = 100;
        let score = 0;
        let gameOver = false;
        let riverOffset = 0;
        let baseScrollSpeed = 1.2;

        let shootTimer = 0;
        const SHOOT_COOLDOWN = 10;

        let bullets = [];
        let entities = [];
        const keys = { up: false, down: false, left: false, right: false, shoot: false };

        function getRiverBounds(screenY) {
            const worldY = screenY - riverOffset;
            const center = 110 + Math.sin(worldY * 0.015) * 35;
            const width = 100 + Math.cos(worldY * 0.01) * 20;
            return { left: center - width / 2, right: center + width / 2 };
        }

        function resetGame() {
            riverOffset = 0;
            fuel = 100;
            score = 0;
            shootTimer = 0;
            entities = [];
            bullets = [];
            
            const bounds = getRiverBounds(210);
            player.x = (bounds.left + bounds.right) / 2 - player.w / 2;
            player.y = 210;

            keys.left = false;
            keys.right = false;
            keys.up = false;
            keys.down = false;
            keys.shoot = false;

            gameOver = false;
        }

        function spawnEntity() {
            if (Math.random() < 0.045) {
                const types = ['HELI', 'SHIP', 'FUEL'];
                const type = types[Math.floor(Math.random() * types.length)];
                const sprWidth = SPRITES[type].width;
                
                const spawnScreenY = -30;
                const bounds = getRiverBounds(spawnScreenY);
                
                const minX = bounds.left + 4;
                const maxX = bounds.right - sprWidth - 4;

                if (maxX > minX) {
                    const x = minX + Math.random() * (maxX - minX);
                    entities.push({
                        type,
                        x,
                        worldY: spawnScreenY - riverOffset,
                        w: sprWidth,
                        vx: (type === 'HELI') ? (Math.random() > 0.5 ? 0.6 : -0.6) :
                            (type === 'SHIP') ? (Math.random() > 0.5 ? 0.3 : -0.3) : 0
                    });
                }
            }
        }

        function update() {
            if (gameOver) return;

            let currentScrollSpeed = baseScrollSpeed;
            if (keys.up) currentScrollSpeed = 2.4;
            if (keys.down) currentScrollSpeed = 0.6;

            fuel -= 0.05 * (currentScrollSpeed / baseScrollSpeed);
            if (fuel <= 0) {
                gameOver = true;
                return;
            }

            riverOffset += currentScrollSpeed;

            if (keys.left) player.x -= player.speed;
            if (keys.right) player.x += player.speed;

            if (shootTimer > 0) shootTimer--;
            if (keys.shoot && shootTimer === 0) {
                bullets.push({ x: player.x + 8, y: player.y });
                shootTimer = SHOOT_COOLDOWN;
            }

            const currentBounds = getRiverBounds(player.y);
            if (player.x < currentBounds.left || player.x + player.w > currentBounds.right) {
                gameOver = true;
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= 6;
                if (bullets[i].y < 0) bullets.splice(i, 1);
            }

            spawnEntity();

            for (let i = entities.length - 1; i >= 0; i--) {
                const e = entities[i];
                const screenY = e.worldY + riverOffset;
                
                e.x += e.vx;

                const b = getRiverBounds(screenY);
                const minX = b.left + 2;
                const maxX = b.right - e.w - 2;

                if (e.x < minX) {
                    e.x = minX;
                    e.vx = Math.abs(e.vx);
                } else if (e.x > maxX) {
                    e.x = maxX;
                    e.vx = -Math.abs(e.vx);
                }

                let destroyed = false;

                for (let j = bullets.length - 1; j >= 0; j--) {
                    const bullet = bullets[j];
                    if (bullet.x >= e.x && bullet.x <= e.x + e.w &&
                        bullet.y >= screenY && bullet.y <= screenY + 18) {
                        
                        if (e.type === 'FUEL') {
                            fuel = Math.min(100, fuel + 35);
                            score += 50;
                        } else {
                            score += 100;
                        }

                        bullets.splice(j, 1);
                        destroyed = true;
                        break;
                    }
                }

                if (destroyed) {
                    entities.splice(i, 1);
                    continue;
                }

                if (player.x < e.x + e.w && player.x + player.w > e.x &&
                    player.y < screenY + 16 && player.y + player.h > screenY) {
                    
                    if (e.type === 'FUEL') {
                        fuel = Math.min(100, fuel + 35);
                        score += 50;
                        entities.splice(i, 1);
                    } else {
                        gameOver = true;
                    }
                    continue;
                }

                if (screenY > canvas.height + 40) {
                    entities.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < canvas.height; y += 4) {
                const bounds = getRiverBounds(y);
                ctx.fillStyle = '#386641';
                ctx.fillRect(0, y, bounds.left, 4);
                ctx.fillRect(bounds.right, y, canvas.width - bounds.right, 4);

                ctx.fillStyle = '#1d4ed8';
                ctx.fillRect(bounds.left, y, bounds.right - bounds.left, 4);
            }

            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f38ba8';
                ctx.font = 'bold 16px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, 110);
                ctx.fillStyle = '#FFF';
                ctx.font = '11px monospace';
                ctx.fillText(`SCORE: ${Math.floor(score)}`, canvas.width / 2, 135);
                ctx.fillText('Aperte Espaço ou Botão A', canvas.width / 2, 160);
                return;
            }

            entities.forEach(e => {
                const screenY = e.worldY + riverOffset;
                drawSprite(e.type, e.x, screenY);
            });

            ctx.fillStyle = '#FACC15';
            bullets.forEach(b => ctx.fillRect(b.x, b.y, 2, 6));

            drawSprite('PLAYER', player.x, player.y);

            ctx.fillStyle = '#11111b';
            ctx.fillRect(0, 0, canvas.width, 24);
            
            ctx.fillStyle = '#FFF';
            ctx.font = 'bold 10px monospace';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE:${Math.floor(score)}`, 6, 15);

            ctx.fillText(`FUEL`, 120, 15);
            ctx.fillStyle = '#313244';
            ctx.fillRect(150, 6, 60, 10);
            ctx.fillStyle = fuel > 25 ? '#a6e3a1' : '#f38ba8';
            ctx.fillRect(151, 7, (fuel / 100) * 58, 8);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        /* ----- CONTROLE DO JOYSTICK VIRTUAL ----- */
        const joyBase = document.getElementById('joystick-base');
        const joyKnob = document.getElementById('joystick-knob');
        let isDragging = false;

        function updateJoystick(clientX, clientY) {
            const rect = joyBase.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + (rect.height / 2) - 10;

            let dx = clientX - centerX;
            let dy = clientY - centerY;

            const maxDistance = 22;
            const distance = Math.hypot(dx, dy);

            if (distance > maxDistance) {
                dx = (dx / distance) * maxDistance;
                dy = (dy / distance) * maxDistance;
            }

            joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;

            const threshold = 6;
            keys.left = dx < -threshold;
            keys.right = dx > threshold;
            keys.up = dy < -threshold;
            keys.down = dy > threshold;
        }

        function resetJoystick() {
            isDragging = false;
            joyKnob.style.transform = 'translate(0px, 0px)';
            keys.left = false;
            keys.right = false;
            keys.up = false;
            keys.down = false;
        }

        // Eventos de Toque (Mobile)
        joyBase.addEventListener('touchstart', e => {
            e.preventDefault();
            isDragging = true;
            updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        window.addEventListener('touchmove', e => {
            if (isDragging && e.touches.length > 0) {
                updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        window.addEventListener('touchend', resetJoystick);
        window.addEventListener('touchcancel', resetJoystick);

        // Eventos de Mouse (Desktop)
        joyBase.addEventListener('mousedown', e => {
            isDragging = true;
            updateJoystick(e.clientX, e.clientY);
        });

        window.addEventListener('mousemove', e => {
            if (isDragging) updateJoystick(e.clientX, e.clientY);
        });

        window.addEventListener('mouseup', resetJoystick);

        /* ----- SUPORTE AO TECLADO ----- */
        window.addEventListener('keydown', e => {
            if (gameOver && (e.key === ' ' || e.key === 'Enter')) {
                resetGame();
                return;
            }
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
            if (e.key === ' ' || e.key === 'j') keys.shoot = true;
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
            if (e.key === ' ' || e.key === 'j') keys.shoot = false;
        });

        /* ----- BOTÕES DE AÇÃO ----- */
        function bindActionButton(id) {
            const btn = document.getElementById(id);
            const startShoot = (e) => {
                e.preventDefault();
                if (gameOver) resetGame();
                else keys.shoot = true;
            };
            const stopShoot = (e) => {
                e.preventDefault();
                keys.shoot = false;
            };

            btn.addEventListener('mousedown', startShoot);
            btn.addEventListener('mouseup', stopShoot);
            btn.addEventListener('mouseleave', stopShoot);
            btn.addEventListener('touchstart', startShoot, { passive: false });
            btn.addEventListener('touchend', stopShoot, { passive: false });
        }

        bindActionButton('btn-a');
        bindActionButton('btn-b');

        resetGame();
        gameLoop();
    </script>
</body>
</html>
