<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Jogo Retro 16-bit Mobile</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #111;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    /* Tela de Jogo */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 60vh;
      background-color: #0088ff; /* Cor da água/fundo */
      border: 4px solid #333;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
    }

    canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated; /* Mantém a estética 16-bit afiada */
      image-rendering: crisp-edges;
    }

    /* Painel de Controles Mobile 16-bit */
    #mobile-controls {
      width: 100%;
      max-width: 480px;
      height: 35vh;
      background-color: #22222b;
      border: 4px solid #444455;
      border-top: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    /* D-PAD Retro (Direcionais) */
    .d-pad {
      position: relative;
      width: 120px;
      height: 120px;
    }

    .d-btn {
      position: absolute;
      background-color: #3a3a48;
      border: 3px solid #1a1a24;
      box-shadow: inset 2px 2px 0 #5a5a6e, inset -2px -2px 0 #000;
      active-background-color: #2a2a38;
    }

    .d-btn:active, .d-btn.active {
      background-color: #1e1e28;
      box-shadow: inset -2px -2px 0 #5a5a6e, inset 2px 2px 0 #000;
    }

    .d-up    { top: 0; left: 40px; width: 40px; height: 45px; border-radius: 6px 6px 0 0; }
    .d-down  { bottom: 0; left: 40px; width: 40px; height: 45px; border-radius: 0 0 6px 6px; }
    .d-left  { top: 40px; left: 0; width: 45px; height: 40px; border-radius: 6px 0 0 6px; }
    .d-right { top: 40px; right: 0; width: 45px; height: 40px; border-radius: 0 6px 6px 0; }
    .d-center { top: 40px; left: 40px; width: 40px; height: 40px; background-color: #3a3a48; }

    /* Botões de Ação 16-bit (A / B) */
    .action-buttons {
      display: flex;
      gap: 15px;
      transform: rotate(-15deg); /* Inclinação clássica estilo SNES */
    }

    .btn-action {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 3px solid #1a1a24;
      color: #fff;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 3px 3px 0 rgba(255,255,255,0.4), inset -3px -3px 0 rgba(0,0,0,0.6);
    }

    .btn-a { background-color: #cc2222; } /* Botão A Vermelho */
    .btn-b { background-color: #eedd00; color: #111; } /* Botão B Amarelo */

    .btn-action:active, .btn-action.active {
      transform: scale(0.95);
      box-shadow: inset -3px -3px 0 rgba(255,255,255,0.4), inset 3px 3px 0 rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="320" height="400"></canvas>
  </div>

  <!-- Controles Mobile -->
  <div id="mobile-controls">
    <!-- D-PAD -->
    <div class="d-pad">
      <div class="d-btn d-up" id="btn-up"></div>
      <div class="d-btn d-left" id="btn-left"></div>
      <div class="d-btn d-center"></div>
      <div class="d-btn d-right" id="btn-right"></div>
      <div class="d-btn d-down" id="btn-down"></div>
    </div>

    <!-- Botões de Ação -->
    <div class="action-buttons">
      <div class="btn-action btn-b" id="btn-b">B</div>
      <div class="btn-action btn-a" id="btn-a">A</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Desativa suavização para manter os pixels nítidos (16-bit)
    ctx.imageSmoothingEnabled = false;

    // Carregar a imagem com as sprites que você enviou
    const spritesheet = new Image();
    spritesheet.src = 'image_e9ab6b.png'; // Substitua pelo caminho local da imagem se necessário

    // Mapeamento dos recortes de cada sprite na imagem original (X, Y, Largura, Altura)
    const sprites = {
      fuel:       { x: 380, y: 200, w: 140, h: 210 },
      helicopter: { x: 280, y: 600, w: 90,  h: 80  },
      airplane:   { x: 570, y: 620, w: 130, h: 120 },
      ship:       { x: 130, y: 730, w: 160, h: 100 }
    };

    // Estado do Jogador (Avião)
    const player = {
      x: 140,
      y: 300,
      speed: 3
    };

    // Estado dos Botões
    const keys = { left: false, right: false, up: false, down: false, fire: false };

    // Mapeamento de Eventos Touch/Click para os botões mobile
    function setupTouchButton(id, keyName) {
      const btn = document.getElementById(id);
      
      const start = (e) => { e.preventDefault(); keys[keyName] = true; btn.classList.add('active'); };
      const end = (e) => { e.preventDefault(); keys[keyName] = false; btn.classList.remove('active'); };

      btn.addEventListener('touchstart', start);
      btn.addEventListener('touchend', end);
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
    }

    setupTouchButton('btn-left', 'left');
    setupTouchButton('btn-right', 'right');
    setupTouchButton('btn-up', 'up');
    setupTouchButton('btn-down', 'down');
    setupTouchButton('btn-a', 'fire');

    // Loop Principal do Jogo
    function update() {
      if (keys.left && player.x > 10) player.x -= player.speed;
      if (keys.right && player.x < canvas.width - 40) player.x += player.speed;
      if (keys.up && player.y > 10) player.y -= player.speed;
      if (keys.down && player.y < canvas.height - 40) player.y += player.speed;
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!spritesheet.complete) return;

      // 1. Desenhar o Tanque de Combustível (FUEL)
      ctx.drawImage(
        spritesheet, 
        sprites.fuel.x, sprites.fuel.y, sprites.fuel.w, sprites.fuel.h,
        130, 20, 60, 90
      );

      // 2. Desenhar o Helicóptero
      ctx.drawImage(
        spritesheet, 
        sprites.helicopter.x, sprites.helicopter.y, sprites.helicopter.w, sprites.helicopter.h,
        30, 120, 45, 40
      );

      // 3. Desenhar o Navio
      ctx.drawImage(
        spritesheet, 
        sprites.ship.x, sprites.ship.y, sprites.ship.w, sprites.ship.h,
        210, 180, 80, 50
      );

      // 4. Desenhar o Jogador (Avião Vermelho)
      ctx.drawImage(
        spritesheet, 
        sprites.airplane.x, sprites.airplane.y, sprites.airplane.w, sprites.airplane.h,
        player.x, player.y, 45, 40
      );
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    spritesheet.onload = () => {
      gameLoop();
    };
  </script>
</body>
</html>
