<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Game Console</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0b0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Console Frame */
        #game-wrapper {
            width: 340px;
            background: linear-gradient(145deg, #2b2d42, #1d1e2c);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 2px 3px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #3d405b;
        }

        /* Screen Bezel */
        .screen-bezel {
            width: 100%;
            background-color: #12131a;
            border-radius: 16px;
            padding: 15px 15px 10px 15px;
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.8);
            border: 2px solid #252836;
        }

        .screen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .power-led {
            width: 8px;
            height: 8px;
            background-color: #ff3333;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff3333;
        }

        .screen-title {
            color: #5c677d;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Canvas Display */
        #gameCanvas {
            width: 100%;
            height: 260px;
            background-color: #8bac0f;
            border-radius: 6px;
            display: block;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2);
            image-rendering: pixelated;
        }

        /* Controls Section */
        .controls-area {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding: 0 10px;
        }

        /* D-Pad */
        .d-pad {
            position: relative;
            width: 90px;
            height: 90px;
        }

        .d-btn {
            position: absolute;
            background-color: #15161e;
            border: none;
            box-shadow: 0 4px 0 #090a0d, inset 0 1px 1px rgba(255,255,255,0.1);
            cursor: pointer;
            active: translate(0, 2px);
        }

        .d-btn:active {
            background-color: #0d0e13;
            box-shadow: 0 2px 0 #090a0d;
            transform: translateY(2px);
        }

        .d-up { top: 0; left: 30px; width: 30px; height: 32px; border-radius: 6px 6px 0 0; }
        .d-down { bottom: 0; left: 30px; width: 30px; height: 32px; border-radius: 0 0 6px 6px; }
        .d-left { top: 30px; left: 0; width: 32px; height: 30px; border-radius: 6px 0 0 6px; }
        .d-right { top: 30px; right: 0; width: 32px; height: 30px; border-radius: 0 6px 6px 0; }
        .d-center { top: 30px; left: 30px; width: 30px; height: 30px; background-color: #15161e; }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 15px;
            transform: rotate(-12deg);
        }

        .btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            font-weight: bold;
            font-size: 16px;
            color: #fff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.5), inset 0 2px 2px rgba(255, 255, 255, 0.2);
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.5);
        }

        .btn-b { background-color: #e6a100; }
        .btn-a { background-color: #e63946; }

        /* Start / Select */
        .system-buttons {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }

        .sys-btn {
            width: 50px;
            height: 12px;
            background-color: #15161e;
            border: none;
            border-radius: 6px;
            transform: rotate(-25deg);
            cursor: pointer;
            box-shadow: 0 2px 0 #000;
        }

        .sys-btn:active {
            transform: rotate(-25deg) translateY(1px);
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div class="screen-bezel">
            <div class="screen-header">
                <div class="power-led"></div>
                <div class="screen-title">8-BIT SYSTEM</div>
            </div>
            <canvas id="gameCanvas" width="200" height="200"></canvas>
        </div>

        <div class="controls-area">
            <div class="d-pad">
                <button class="d-btn d-up" id="btn-up"></button>
                <button class="d-btn d-down" id="btn-down"></button>
                <button class="d-btn d-left" id="btn-left"></button>
                <button class="d-btn d-right" id="btn-right"></button>
                <div class="d-center"></div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-b" id="btn-b">B</button>
                <button class="btn btn-a" id="btn-a">A</button>
            </div>
        </div>

        <div class="system-buttons">
            <button class="sys-btn" id="btn-select"></button>
            <button class="sys-btn" id="btn-start"></button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Configurações do Jogo (Snake Retro)
        const gridSize = 10;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER'
        let gameInterval = null;

        // Paleta Retro Game Boy
        const COLORS = {
            bg: '#8bac0f',
            dark: '#0f380f',
            medium: '#306230',
            light: '#9bbc0f'
        };

        function drawScreen() {
            // Fundo
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'START') {
                ctx.fillStyle = COLORS.dark;
                ctx.font = 'bold 16px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('SNAKE RETRO', 100, 80);
                
                ctx.font = '10px monospace';
                ctx.fillText('Pressione A ou START', 100, 120);
                ctx.fillText('para jogar', 100, 135);
            } 
            else if (gameState === 'PLAYING') {
                // Comida
                ctx.fillStyle = COLORS.dark;
                ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 1, gridSize - 1);

                // Cobra
                snake.forEach((part, index) => {
                    ctx.fillStyle = index === 0 ? COLORS.dark : COLORS.medium;
                    ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 1, gridSize - 1);
                });

                // Placar
                ctx.fillStyle = COLORS.dark;
                ctx.font = '10px monospace';
                ctx.textAlign = 'left';
                ctx.fillText(`PTS: ${score}`, 5, 12);
            } 
            else if (gameState === 'GAMEOVER') {
                ctx.fillStyle = COLORS.dark;
                ctx.font = 'bold 16px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', 100, 80);
                
                ctx.font = '12px monospace';
                ctx.fillText(`Score: ${score}`, 100, 110);
                
                ctx.font = '10px monospace';
                ctx.fillText('Pressione A p/ reiniciar', 100, 140);
            }
        }

        function updateGame() {
            if (gameState !== 'PLAYING') return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Colisão com Paredes
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameState = 'GAMEOVER';
                drawScreen();
                return;
            }

            // Colisão com Corpo
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameState = 'GAMEOVER';
                    drawScreen();
                    return;
                }
            }

            snake.unshift(head);

            // Comer Comida
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                placeFood();
            } else {
                snake.pop();
            }

            drawScreen();
        }

        function placeFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
        }

        function startGame() {
            snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }];
            dx = 1;
            dy = 0;
            score = 0;
            placeFood();
            gameState = 'PLAYING';
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 100);
        }

        // Controles de Direção
        function moveUp() { if (dy === 0) { dx = 0; dy = -1; } }
        function moveDown() { if (dy === 0) { dx = 0; dy = 1; } }
        function moveLeft() { if (dx === 0) { dx = -1; dy = 0; } }
        function moveRight() { if (dx === 0) { dx = 1; dy = 0; } }

        function handleAction() {
            if (gameState === 'START' || gameState === 'GAMEOVER') {
                startGame();
            }
        }

        // Eventos dos Botões na Tela
        document.getElementById('btn-up').addEventListener('click', moveUp);
        document.getElementById('btn-down').addEventListener('click', moveDown);Sem depender de nenhuma imagem externa (para zerar os erros de 404), o código abaixo desenha um jogo retrô interativo feito **100% via código dentro do Canvas**, com os botões da tela e do teclado funcionais para movimentar o personagem e pontuar:

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Retro Handheld Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0b0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        #console {

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* Moldura da Tela */
        .screen-bezel {
            width: 100%;
            background-color: #12131a;
            border-radius: 16px;
            padding: 12px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
        }

            background-color: #050508;
            border-radius: 6px;

            background-color: #2e303e;
            border: 1px solid #1a1b24;
            box-shadow: 0 3px 0 #15161d;
            cursor: pointer;
        }

        .dpad-btn:active {
            background-color: #404356;
            transform: translateY(2px);
            box-shadow: 0 1px 0 #15161d;
        }

        .dpad-up { top: 0; left: 30px; width: 30px; height: 32px; border-radius: 6px 6px 0 0; }
        .dpad-down { bottom: 0; left: 30px; width: 30px; height: 32px; border-radius: 0 0 6px 6px; }
        .dpad-left { top: 30px; left: 0; width: 32px; height: 30px; border-radius: 6px 0 0 6px; }
        .dpad-right { top: 30px; right: 0; width: 32px; height: 30px; border-radius: 0 6px 6px 0; }
        .dpad-center { top: 30px; left: 30px; width: 30px; height: 30px; background-color: #2e303e; }

<body>

    <div id="console">
        <div class="screen-bezel">
            <canvas id="gameCanvas" width="256" height="280"></canvas>
        </div>

        <div class="controls">
            <div class="dpad">
                <button class="dpad-btn dpad-up" id="btn-up"></button>
                <button class="dpad-btn dpad-left" id="btn-left"></button>
                <div class="dpad-center"></div>
                <button class="dpad-btn dpad-right" id="btn-right"></button>
                <button class="dpad-btn dpad-down" id="btn-down"></button>
            </div>

            <div class="action-buttons">
                <button class="btn btn-b" id="btn-b">B</button>
                <button class="btn btn-a" id="btn-a">A</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Estado do Jogo
        const player = { x: 120, y: 140, size: 14, speed: 3, color: '#4fc3f7' };
        const coin = { x: 60, y: 60, size: 10 };
        let score = 0;

        const keys = { up: false, down: false, left: false, right: false };

        // Spawn de moeda
        function spawnCoin() {
            coin.x = Math.floor(Math.random() * (canvas.width - 40)) + 20;
            coin.y = Math.floor(Math.random() * (canvas.height - 60)) + 40;
        }

        // Loop principal do jogo
        function update() {
            if (keys.up && player.y > 30) player.y -= player.speed;
            if (keys.down && player.y < canvas.height - player.size) player.y += player.speed;
            if (keys.left && player.x > 0) player.x -= player.speed;
            if (keys.right && player.x < canvas.width - player.size) player.x += player.speed;

            // Colisão com a moeda
            if (player.x < coin.x + coin.size &&
                player.x + player.size > coin.x &&
                player.y < coin.y + coin.size &&
                player.y + player.size > coin.y) {
                score += 10;
                spawnCoin();
            }
        }

        function draw() {
            // Fundo
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grade retrô no fundo
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 20) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 20) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Topo (HUD)
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, 26);
            ctx.fillStyle = '#f8fafc';
            ctx.font = 'bold 12px monospace';
            ctx.fillText(`SCORE: ${score}`, 10, 18);

            // Moeda
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(coin.x + coin.size/2, coin.y + coin.size/2, coin.size/2, 0, Math.PI * 2);
            ctx.fill();

            // Jogador (Pixel Art Player)
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.size, player.size);
            
            // Olho do jogador
            ctx.fillStyle = '#000000';
            ctx.fillRect(player.x + 3, player.y + 3, 3, 3);
            ctx.fillRect(player.x + 8, player.y + 3, 3, 3);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Eventos do Teclado
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
        });

        // Conecta os Botões da Tela (D-Pad e A/B)
        function bindBtn(id, key) {
            const btn = document.getElementById(id);
            const start = () => keys[key] = true;
            const end = () => keys[key] = false;

            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); start(); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); end(); });
        }

        bindBtn('btn-up', 'up');
        bindBtn('btn-down', 'down');
        bindBtn('btn-left', 'left');
        bindBtn('btn-right', 'right');

        // Botão A (Aumenta velocidade temporariamente)
        document.getElementById('btn-a').onclick = () => {
            player.color = '#ff4081';
            player.speed = 5;
            setTimeout(() => { player.color = '#4fc3f7'; player.speed = 3; }, 1000);
        };

        // Botão B (Muda a cor do jogador)
        document.getElementById('btn-b').onclick = () => {
            spawnCoin();
        };

        // Inicia o jogo
        gameLoop();
    </script>
</body>
</html>
