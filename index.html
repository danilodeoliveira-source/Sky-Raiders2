<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Game Canvas</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f0f14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* Corpo do videogame */
        #game-wrapper {
            width: 320px;
            height: 520px;
            background-color: #22222d;
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.1);
        }

        /* Área da Tela */
        .screen-area {
            width: 100%;
            height: 340px;
            background-color: #000000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #16161e;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Área dos Controles */
        .controls-area {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 10px 15px 10px;
        }

        /* Direcional (D-Pad) */
        .d-pad {
            position: relative;
            width: 84px;
            height: 84px;
        }

        .d-pad-btn {
            position: absolute;
            background-color: #323242;
            border: none;
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.1);
        }

        .d-pad .up { top: 0; left: 28px; width: 28px; height: 28px; border-radius: 4px 4px 0 0; }
        .d-pad .down { bottom: 0; left: 28px; width: 28px; height: 28px; border-radius: 0 0 4px 4px; }
        .d-pad .left { top: 28px; left: 0; width: 28px; height: 28px; border-radius: 4px 0 0 4px; }
        .d-pad .right { top: 28px; right: 0; width: 28px; height: 28px; border-radius: 0 4px 4px 0; }
        .d-pad .center { top: 28px; left: 28px; width: 28px; height: 28px; background-color: #323242; }

        /* Botões A / B */
        .action-buttons {
            display: flex;
            gap: 12px;
            transform: rotate(-12deg);
        }

        .btn-action {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            color: #fff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-action:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
        }

        #btn-b { background-color: #e2b024; color: #111; }
        #btn-a { background-color: #d9383a; color: #fff; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <!-- Tela com o Canvas -->
        <div class="screen-area">
            <canvas id="gameCanvas" width="288" height="340"></canvas>
        </div>

        <!-- Controles Inferiores -->
        <div class="controls-area">
            <div class="d-pad">
                <button class="d-pad-btn up"></button>
                <button class="d-pad-btn left"></button>
                <div class="center"></div>
                <button class="d-pad-btn right"></button>
                <button class="d-pad-btn down"></button>
            </div>

            <div class="action-buttons">
                <button class="btn-action" id="btn-b">B</button>
                <button class="btn-action" id="btn-a">A</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Tela de contingência (desenhada caso a imagem não exista)
        function renderFallbackScreen() {
            ctx.fillStyle = '#181825';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#a6e3a1';
            ctx.fillRect(canvas.width / 2 - 40, canvas.height / 2 - 40, 80, 80);

            ctx.fillStyle = '#ffffff';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Canvas Ativo!', canvas.width / 2, 80);
            ctx.font = '11px sans-serif';
            ctx.fillStyle = '#aaaaaa';
            ctx.fillText('(Imagem image_e9ab6b.png não encontrada)', canvas.width / 2, 100);
        }

        // Tenta carregar a imagem do jogo
        const bgImage = new Image();
        bgImage.src = 'image_e9ab6b.png';

        bgImage.onload = () => {
            ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
        };

        bgImage.onerror = () => {
            renderFallbackScreen();
        };
    </script>
</body>
</html>
